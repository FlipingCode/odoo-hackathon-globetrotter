<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlobeTrotter - Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }
.box1 {
  position: absolute;
  z-index: 1;
}

.box2 {
  position: absolute;
  z-index: 2;
}
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5f7c 50%, #4a90a4 100%);
    padding: 20px;
  }

  .login-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }

  .logo-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a90a4, #2c5f7c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #fff;
    box-shadow: 0 6px 16px rgba(44, 95, 124, 0.35);
  }

  .brand-name {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #1e3a5f;
    margin-bottom: 4px;
  }

  .brand-subtitle {
    text-align: center;
    font-size: 13px;
    color: #7a8a99;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 18px;
    position: relative;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4a5a6a;
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #dde3e8;
    border-radius: 8px;
    font-size: 14px;
    color: #1e2a35;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .form-group input:focus {
    border-color: #4a90a4;
    box-shadow: 0 0 0 3px rgba(74, 144, 164, 0.15);
  }

  .form-group input.error {
    border-color: #e05252;
  }

  .error-message {
    color: #e05252;
    font-size: 12px;
    margin-top: 4px;
    display: none;
  }

  .error-message.show {
    display: block;
  }

  .options-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    font-size: 13px;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #4a5a6a;
  }

  .forgot-link {
    color: #2c5f7c;
    text-decoration: none;
    font-weight: 600;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }
