<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlobeTrotter - Register</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5f7c 50%, #4a90a4 100%);
    padding: 20px;
  }

  .register-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }

  .logo-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a90a4, #2c5f7c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #fff;
    box-shadow: 0 6px 16px rgba(44, 95, 124, 0.35);
  }

  .brand-name {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #1e3a5f;
    margin-bottom: 4px;
  }

  .brand-subtitle {
    text-align: center;
    font-size: 13px;
    color: #7a8a99;
    margin-bottom: 24px;
  }

  .form-row {
    display: flex;
    gap: 16px;
  }

  .form-row .form-group {
    flex: 1;
  }

  .form-group {
    margin-bottom: 16px;
    position: relative;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4a5a6a;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #dde3e8;
    border-radius: 8px;
    font-size: 14px;
    color: #1e2a35;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #4a90a4;
    box-shadow: 0 0 0 3px rgba(74, 144, 164, 0.15);
  }

  .form-group input.error,
  .form-group textarea.error {
    border-color: #e05252;
  }

  .error-message {
    color: #e05252;
    font-size: 12px;
    margin-top: 4px;
    display: none;
  }

  .error-message.show {
    display: block;
  }

  .register-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #2c5f7c, #4a90a4);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 16px rgba(44, 95, 124, 0.3);
    margin-top: 8px;
  }

  .register-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(44, 95, 124, 0.4);
  }

  .register-btn:active {
    transform: translateY(0);
  }

  .register-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .login-text {
    text-align: center;
    font-size: 13px;
    color: #4a5a6a;
    margin-top: 20px;
  }

  .login-text a {
    color: #2c5f7c;
    font-weight: 700;
    text-decoration: none;
  }

  .login-text a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .form-row {
      flex-direction: column;
      gap: 0;
    }
  }
</style>
</head>
<body>

<div class="register-card">
  <div class="logo-wrapper">
    <div class="logo-circle">✈</div>
  </div>
  <div class="brand-name">GlobeTrotter</div>
  <div class="brand-subtitle">Create an account to start planning</div>

  <form id="registerForm" novalidate>
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" placeholder="First Name" />
        <div class="error-message" id="firstNameError">First name is required</div>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" placeholder="Last Name" />
        <div class="error-message" id="lastNameError">Last name is required</div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Email Address" />
        <div class="error-message" id="emailError">Valid email is required</div>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" />
        <div class="error-message" id="phoneError">Phone number is required</div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="City" />
        <div class="error-message" id="cityError">City is required</div>
      </div>
      <div class="form-group">
        <label for="country">Country</label>
        <input type="text" id="country" name="country" placeholder="Country" />
        <div class="error-message" id="countryError">Country is required</div>
      </div>
    </div>

    <div class="form-group">
      <label for="additionalInfo">Additional Information ....</label>
      <textarea id="additionalInfo" name="additionalInfo" placeholder="Tell us about your travel preferences..."></textarea>
    </div>

    <button type="submit" class="register-btn" id="registerBtn">Register User</button>
  </form>

  <div class="login-text">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
  const form = document.getElementById('registerForm');
  const registerBtn = document.getElementById('registerBtn');

  const fields = [
    { id: 'firstName', errorId: 'firstNameError' },
    { id: 'lastName', errorId: 'lastNameError' },
    { id: 'email', errorId: 'emailError', isEmail: true },
    { id: 'phone', errorId: 'phoneError' },
    { id: 'city', errorId: 'cityError' },
    { id: 'country', errorId: 'countryError' }
  ];

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    let isValid = true;

    // Reset validation states
    fields.forEach(field => {
      const input = document.getElementById(field.id);
      const errorMsg = document.getElementById(field.errorId);
      input.classList.remove('error');
      errorMsg.classList.remove('show');

      const value = input.value.trim();
      if (!value) {
        input.classList.add('error');
        errorMsg.classList.add('show');
        isValid = false;
      } else if (field.isEmail && !/\S+@\S+\.\S+/.test(value)) {
        input.classList.add('error');
        errorMsg.textContent = 'Please enter a valid email address';
        errorMsg.classList.add('show');
        isValid = false;
      }
    });

    if (!isValid) return;

    // Simulate API registration call
    registerBtn.disabled = true;
    registerBtn.textContent = 'Registering...';

    const payload = {
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      city: document.getElementById('city').value.trim(),
      country: document.getElementById('country').value.trim(),
      additionalInfo: document.getElementById('additionalInfo').value.trim()
    };

    fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then((res) => res.json())
      .then((data) => {
        if (data.success) {
          window.location.href = 'login.html';
        } else {
          alert(data.message || 'Registration failed. Please try again.');
        }
      })
      .catch(() => {
        alert('Something went wrong. Please try again.');
      })
      .finally(() => {
        registerBtn.disabled = false;
        registerBtn.textContent = 'Register User';
      });
  });
</script>

</body>
</html>
